name: build

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recognizer-core:
    name: recognizer-core tests (pure JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :recognizer-core:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recognizer-core-test-report
          path: recognizer-core/build/reports/tests/test
          if-no-files-found: ignore

  futo-apk:
    name: FUTO unstable-debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0          # FUTO's build.gradle derives versionCode from git history + tags
          lfs: true

      - name: Pull LFS blobs inside the swipe-model submodule
        run: |
          sudo apt-get install -y -q git-lfs >/dev/null
          git -C upstream/java/assets/futo-swipe lfs pull || echo "::warning::futo-swipe LFS pull failed; swipe typing will degrade in this build"
          git -C upstream fetch --tags --force origin || true

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;28.2.13676358
            cmake;3.22.1

      - name: Python deps for FUTO's bundle task
        run: python3 -m pip install -q requests

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Apply handwriting patches to upstream
        run: bash scripts/apply-patches.sh

      - name: Build
        working-directory: upstream
        run: ./gradlew --no-daemon --stacktrace assembleUnstableDebug

      - name: Rename
        run: |
          APK=$(ls upstream/build/outputs/apk/unstable/debug/*.apk | head -1)
          SHORT=$(git rev-parse --short HEAD)
          cp "$APK" "futo-handwriting-unstable-debug-$SHORT.apk"
          echo "APK=futo-handwriting-unstable-debug-$SHORT.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: futo-handwriting-unstable-debug-apk
          path: ${{ env.APK }}
          retention-days: 14
